{% extends "layout.html" %}
{% block content %}
<section class="w-band">
    <div class="w-container w-auth">
        <div class="w-card" style="text-align:center">
            <div class="w-brand-mark" style="width:72px;height:72px;font-size:28px;margin:0 auto 16px" aria-hidden="true">{{ current_user.username[:1] }}</div>
            <h1 class="w-page-title" style="font-size:32px">{{ current_user.username }}</h1>
            <p class="w-small">{{ current_user.email }}</p>
            <div class="w-btn-row" style="justify-content:center;margin-top:24px">
                <a href="{{ url_for('generate') }}" class="w-btn w-btn--primary">덱 만들기</a>
                <a href="{{ url_for('logout') }}" class="w-btn w-btn--outline">로그아웃</a>
            </div>
        </div>
    </div>
</section>
{% endblock content %}
